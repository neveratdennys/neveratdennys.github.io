---
layout: default
---

<article class="post-layout">
  <header class="page-intro page-intro-post">
    <p class="eyebrow">Writing</p>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.topics %}
        {% for topic in page.topics %}
          <span class="topic-chip">{{ topic }}</span>
        {% endfor %}
      {% endif %}
    </div>
    {% if page.summary %}
      <p class="page-copy">{{ page.summary }}</p>
    {% endif %}
  </header>

  <div class="post-body-wrap">
    <div class="post-body">
      {{ content }}
    </div>
    <aside class="post-toc" aria-label="Table of contents">
      <p class="post-toc-label">On this page</p>
      <nav class="post-toc-nav"></nav>
    </aside>
  </div>
</article>

<script src="{{ '/assets/js/post-toc.js' | relative_url }}" defer></script>
